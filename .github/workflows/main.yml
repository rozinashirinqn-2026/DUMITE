name: Публикуване на сайта

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Изтегляне на файловете
        uses: actions/checkout@v4

      - name: Настройване на Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Инсталиране на зависимостите
        run: npm install

      - name: Изграждане на сайта
        run: npm run build

      - name: Настройване на GitHub Pages
        uses: actions/configure-pages@v5

      - name: Качване на готовия сайт
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Публикуване
        id: deployment
        uses: actions/deploy-pages@v4
